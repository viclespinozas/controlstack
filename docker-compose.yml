services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      #MONGO_URI: mongodb://mongo:27017
      #DATABASE_NAME: controlstack
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      #- mongo
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  postgres:
    image: postgres:16
    container_name: controlstack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  #mongo:
  #  image: mongo:7
  #  container_name: controlstack_mongo
  #  restart: unless-stopped
  #  ports:
  #    - "27017:27017"
  #  volumes:
  #    - mongo_data:/data/db

volumes:
  #mongo_data:
  postgres_data:
